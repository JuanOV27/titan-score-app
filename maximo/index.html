<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Máximo Titán · Titan Score</title>
  <meta name="description" content="Pregúntale a Máximo Titán, el guardián de Titan Score, todo sobre la app.">
  <link rel="stylesheet" href="css/web.css">
</head>
<body>
  <div id="mundo" aria-hidden="true"></div>

  <header class="cabecera">
    <p class="marca">TITAN SCORE</p>
    <h1>Máximo Titán</h1>
  </header>

  <section id="subtitulo" class="subtitulo" aria-live="polite" hidden>
    <p id="subtituloTexto"></p>
  </section>

  <section class="chat" aria-label="Pregúntale a Máximo">
    <div id="sugerencias" class="sugerencias"></div>
    <form id="formulario" class="formulario" autocomplete="off">
      <label class="oculto" for="texto">Tu pregunta</label>
      <input id="texto" name="texto" type="text" maxlength="150" placeholder="Pregúntale a Máximo…" enterkeyhint="send" disabled>
      <button id="enviar" type="submit" disabled>Enviar</button>
    </form>
    <p class="pie"><a class="descargar" href="https://juanov27.github.io/titan-score-app/">Descargar Titan Beta</a> · ¿Quieres la experiencia completa con Nubosa y el Coloso? Ven al puesto de Titan Score.</p>
  </section>

  <div id="despertar" class="despertar">
    <div class="tarjeta">
      <p class="antetitulo">El Templo te espera</p>
      <h2>Máximo Titán</h2>
      <p>El guardián de Titan Score responde tus preguntas sobre la app. Sube el volumen.</p>
      <button id="botonDespertar" type="button" disabled>Despertando al titán…</button>
      <p id="progreso" class="progreso">Cargando el modelo 3D</p>
    </div>
  </div>

  <script type="module" src="js/web.js"></script>
</body>
</html>
